urrentColor" fill-opacity=".07" stroke="currentColor" stroke-width="2"/><path d="M4 16h56" stroke="currentColor" stroke-opacity=".35"/><circle cx="12" cy="10" r="1.5" fill="currentColor"/><circle cx="18" cy="10" r="1.5" fill="currentColor"/><circle cx="24" cy="10" r="1.5" fill="currentColor"/><path d="m16 26 9 8-9 8m17 0h13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SMS</span></div><h2>美区接码</h2><p class="price-label">商品售价 / 每个</p><p class="price"><small>¥</small>5</p><div class="payment-options" aria-label="美区接码付款方式"><button type="button" class="pay-option wechat" data-method="微信支付" data-product="美区接码" data-amount="5"><span aria-hidden="true">微</span>微信支付</button><button type="button" class="pay-option alipay" data-method="支付宝" data-product="美区接码" data-amount="5"><span aria-hidden="true">支</span>支付宝</button></div></article></div></main><footer>微信：sxzhaoniu</footer><dialog id="payment-dialog" aria-labelledby="payment-title"><h2 id="payment-title"></h2><div class="payment-summary"><p id="payment-product"></p><strong class="payment-total" id="payment-amount"></strong></div><div id="wechat-qr" hidden><a href="./assets/wechat-pay.jpg" target="_blank" rel="noopener" aria-label="打开微信收款码原图"><img src="./assets/wechat-pay.jpg" alt="微信收款码，收款人孙贤泽" width="1280" height="1768"></a><p class="qr-hint">使用微信扫一扫，或保存图片后在微信中识别。点击二维码可查看原图。</p><p class="qr-hint">请核对收款人为“孙贤泽”，并按上方金额付款。付款后请联系微信客服核实到账与发货。</p></div><p class="payment-note" id="payment-note">该支付方式暂未开放，购买请联系微信客服。</p><p class="payment-contact">微信：sxzhaoniu</p><form method="dialog"><button class="close">返回商品</button></form></dialog><script>const paymentDialog=document.getElementById('payment-dialog');document.querySelectorAll('.pay-option').forEach(button=>button.addEventListener('click',()=>{document.getElementById('payment-title').textContent=button.dataset.method;document.getElementById('payment-product').textContent=button.dataset.product;document.getElementById('payment-amount').textContent='¥'+button.dataset.amount;const wechat=button.dataset.method==='微信支付';document.getElementById('wechat-qr').hidden=!wechat;document.getElementById('payment-note').hidden=wechat;paymentDialog.showModal();paymentDialog.scrollTop=0}));paymentDialog.addEventListener('click',event=>{if(event.target===paymentDialog){const r=paymentDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)paymentDialog.close()}});</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品购买与使用说明</title><style>
:root{color-scheme:dark;--bg:#080e1c;--panel:#101c30;--line:#293b54;--text:#e6eef9;--muted:#9cafc7;--accent:#6ce7ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#153b504f,transparent 55%),var(--bg);color:var(--text);font:16px/1.7 "Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit}header{border-bottom:1px solid var(--line)}.wrap{max-width:1160px;margin:auto;padding:0 28px}header .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700}.contact{font-size:13px;color:var(--muted)}main{padding:64px 0 72px}.eyebrow{color:var(--accent);font:12px monospace;letter-spacing:3px}h1{font-size:clamp(30px,5vw,48px);line-height:1.3;margin:18px 0} .lead{color:var(--muted);margin:0 0 38px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:26px}.panel{padding:30px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#142238,#0d1729);box-shadow:0 16px 45px #0002}.panel-label{font:12px monospace;color:var(--accent);letter-spacing:2px}h2{font-size:26px;margin:8px 0}.subtitle{color:var(--muted);font-size:14px;margin:0 0 26px}.entries{display:grid;gap:14px}.entry{width:100%;display:flex;align-items:center;gap:16px;padding:20px 18px;border:1px solid #2b405a;border-radius:11px;background:#0b1526;color:var(--text);text-align:left;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}.entry:hover{background:#172a40;border-color:var(--accent);transform:translateY(-2px)}.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:#6ce7ee12;color:var(--accent);font-weight:700}.entry-title{flex:1;font-weight:600}.arrow{color:var(--accent)}.help .panel-label,.help .icon,.help .arrow{color:#a9b8ff}.help .icon{background:#879cff16}footer{padding:24px 0;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:calc(100vw - 36px);width:440px;padding:28px}dialog::backdrop{background:#020710cf}dialog h2{font-size:23px}dialog p{color:var(--muted)}.close{background:var(--accent);color:#07131c;border:0;padding:10px 22px;border-radius:8px;cursor:pointer} @media(max-width:700px){.wrap{padding:0 18px}header .wrap{flex-wrap:wrap;gap:4px;padding-top:14px;padding-bottom:14px}main{padding:36px 0}.columns{grid-template-columns:1fr;gap:20px}.panel{padding:24px 20px}.entry{padding:18px 14px}.contact{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<dialog aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><form method="dialog"><button class="close">返回首页</button></form></dialog><script>
const dialog=document.querySelector('dialog');document.querySelectorAll('[data-title]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('dialog-title').textContent=button.dataset.title;document.getElementById('dialog-message').textContent=button.dataset.message;dialog.showModal()}));dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
</script></body></html>

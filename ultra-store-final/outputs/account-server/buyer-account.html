<section id="buyer-account" class="box" style="padding:28px;margin:30px 0">
<div class="eyebrow">YOUR ACCOUNT · YOUR ORDERS</div><h2>买方账号</h2><p class="subtle">登录后，订单与账号绑定，可在其他设备查看。代理及管理员请使用各自入口。</p>
<p id="customer-message" role="status" style="color:#ffd393;white-space:pre-wrap"></p>
<div id="customer-guest"><div class="choices" style="margin:18px 0"><button class="button" type="button" data-customer-mode="login">登录账号</button><button class="button" type="button" data-customer-mode="register">首次注册</button><button class="button" type="button" data-customer-mode="recover">恢复账号</button></div>
<form id="customer-form" style="max-width:480px"><h3 id="customer-form-title">登录买方账号</h3><label style="display:block;margin:14px 0">账号<input id="customer-username" autocomplete="username" required minlength="4" maxlength="30" placeholder="4–30位字母、数字或下划线" style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid;border-radius:8px"></label><label style="display:block;margin:14px 0">密码<input id="customer-password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少12位" style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid;border-radius:8px"></label><label id="customer-confirm-label" hidden style="display:block;margin:14px 0">再次输入密码<input id="customer-confirm" type="password" autocomplete="new-password" maxlength="128" style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid;border-radius:8px"></label><label id="customer-recover-label" hidden style="display:block;margin:14px 0">恢复密钥<input id="customer-recover-key" autocomplete="off" maxlength="128" style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid;border-radius:8px"></label><button id="customer-submit" class="button primary">登录账号</button></form></div>
<div id="customer-signed" hidden><p><strong id="customer-name"></strong> · 已登录</p><button class="button" type="button" id="customer-logout">退出买方账号</button><details style="margin-top:18px"><summary>修改买方密码</summary><form id="customer-password-form" style="max-width:440px"><label style="display:block;margin:12px 0">原密码<input id="customer-old-password" type="password" required autocomplete="current-password" style="display:block;padding:10px;width:100%;border:1px solid;border-radius:8px"></label><label style="display:block;margin:12px 0">新密码<input id="customer-new-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" style="display:block;padding:10px;width:100%;border:1px solid;border-radius:8px"></label><button class="button">修改并退出所有设备</button></form></details></div>
<div id="customer-recovery-result" hidden style="margin-top:20px;padding:18px;border:1px solid #5e6e52;border-radius:10px"><strong>请立即保存账号恢复密钥</strong><p class="subtle">仅本次显示。忘记密码时，用账号和此密钥重设密码。密钥使用后会轮换，请勿发给他人。</p><pre id="customer-recovery-value" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><button type="button" class="button" id="customer-save-recovery">下载恢复密钥</button></div>
</section>
